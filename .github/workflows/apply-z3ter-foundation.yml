name: Validate Z3tero identity (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the published package lineage is preserved
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'namespace = "com.novacut.editor"' app/build.gradle.kts
          grep -F 'applicationId = "com.novacut.editor"' app/build.gradle.kts
          grep -F '"applicationId": "com.novacut.editor"' scripts/package_identity.json
          grep -F '"publicProductName": "Z3tero"' scripts/package_identity.json
          grep -F '<string name="app_name">Z3tero</string>' app/src/main/res/values/strings.xml
          grep -F '<string name="app_name">Z3tero</string>' app/src/main/res/values-es/strings.xml
