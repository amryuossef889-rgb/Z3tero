name: Build Z3ter Android

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --write-verification-metadata sha256

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --write-verification-metadata sha256

      - name: Assemble final debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --write-verification-metadata sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: z3ter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
